<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Cloudkeel-DD — self-hosted configuration-drift detection for Terraform + Kubernetes">
  <!-- Matches the marketing site's brand tokens exactly (global.css):
       bg 0E1420, teal 2DD4BF, teal-bg 10312E, line 2A3648, ink EAF0F8,
       muted A3B1C5. Chip copy reused verbatim from the site's own OG
       image (scripts/og.svg), not new claims. -->
  <defs>
    <radialGradient id="glow" cx="85%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="230" fill="#0E1420"/>
  <rect width="1200" height="230" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="5" fill="#2DD4BF"/>

  <text x="60" y="88" font-size="48" font-weight="700" fill="#EAF0F8">Cloudkeel-DD</text>
  <text x="60" y="126" font-size="22" fill="#A3B1C5">Self-hosted configuration-drift detection for Terraform + Kubernetes</text>

  <g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#2DD4BF">
    <rect x="60" y="160" width="224" height="40" rx="20" fill="#10312E" stroke="#2A3648"/>
    <text x="80" y="186">Read-only, always</text>
    <rect x="300" y="160" width="256" height="40" rx="20" fill="#10312E" stroke="#2A3648"/>
    <text x="320" y="186">Runs in your cluster</text>
  </g>
</svg>
